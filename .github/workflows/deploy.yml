name: Deploy to GitHub Pages

on:
  # 每次推送到 `main` 分支时触发此工作流
  push:
    branches: [ main ]
  # 允许手动从 Actions 标签页触发
  workflow_dispatch:

# 允许 job 克隆 repo 并创建 page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个部署在运行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # with:
          # path: . # 存储库中 Astro 项目的根位置。（可选）
          # node-version: 22 # 用于构建站点的特定 Node.js 版本,默认为 22。（可选）
          # package-manager: pnpm@latest # 使用的包管理器,会根据 lockfile 自动检测。（可选）

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
